<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>De-bugs的生活</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="default.css" />
  </head>

  <body>
    <nav class="navigation">
      <a href="index.html">简介</a>
      <a href="sammy.html">萨米</a>
    </nav>
    <main>
      <section class="garden">
        <div id="bounce">向下滚动</div>
      </section>
      <p id="hideBounce">
        萨米缓慢而稳定地滑行，在探索花园奇观的过程中留下了闪亮的痕迹。
      </p>
      <img src="spinner.gif" data-src="snail.svg" />
      <p>
        来认识一下嗡嗡蜂，一个身带黄黑条纹的小探险家，它喜欢在花丛中嗡嗡作响，采集甜蜜的花蜜来制作美味的蜂蜜。
      </p>
      <img src="spinner.gif" data-src="bee.png" />
      <p>
        贝拉在附近飞舞，她那鲜艳的翅膀涂上了美丽的色彩，她在花丛间翩翩起舞，所到之处都带来欢乐。
      </p>
      <img src="spinner.gif" data-src="butterfly.png" />
      <p>
        还有露西，一只长着黑色斑点的小红瓢虫，喜欢在花园里玩捉迷藏。
      </p>
      <img src="spinner.gif" data-src="ladybug.png" />
      <p>
        最后但同样重要的是，还有伊吉，一个随时准备进行新冒险的神秘朋友。
      </p>
      <img src="spinner.gif" data-src="insect.png" />
      <p>
        他们一起组成了一群令人愉快的朋友，准备踏上激动人心的旅程！
      </p>
    </main>
  </body>
  <script type="text/javascript" src="scripts.js"></script>
</html>
